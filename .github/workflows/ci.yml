name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - run: corepack enable
      - run: corepack prepare pnpm@11.26.0 --activate
      - run: pnpm install --frozen-lockfile
      # Dependency audit gate (security pass): fails on moderate+ advisories.
      # Overrides for transitive expo-CLI CVEs live in pnpm-workspace.yaml.
      - run: pnpm audit --prod --audit-level moderate
      - run: pnpm contract
      - run: pnpm api:check
      - run: pnpm shots:diff
      - run: pnpm smoke:http
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm dlx expo-doctor
